name: Tournament PoC

# tournament-poc/ だけを対象にした検証。既存 n02 の CI（ci.yml）とは独立している。
on:
  push:
    branches: ['**']
    paths: ['tournament-poc/**', '.github/workflows/tournament-poc.yml', 'vercel.json', 'package.json', 'vite.config.ts']
  pull_request:
    paths: ['tournament-poc/**', '.github/workflows/tournament-poc.yml', 'vercel.json', 'package.json', 'vite.config.ts']

concurrency:
  group: tournament-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build check / unit / e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: dist/ is generated from src/
        run: node tournament-poc/tools/build.mjs --check

      - name: Unit and integration tests
        working-directory: tournament-poc
        run: npm test

      # 画面テストはリポジトリ直下の @playwright/test を使う
      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: tournament-poc
        run: npm run e2e

      # PR プレビュー（Vercel）のビルド: n02 本体 + 大会運営の確認用プレビュー（web/dist/tournament/）。
      # 追跡しているファイル（本番の GitHub Pages の成果物・tournament-poc/dist）を書き換えないこと
      - name: PR preview build leaves tracked files untouched
        run: |
          git status --porcelain > /tmp/tree-before-preview.txt
          VERCEL_ENV=preview npm run build:preview-host
          git status --porcelain > /tmp/tree-after-preview.txt
          diff /tmp/tree-before-preview.txt /tmp/tree-after-preview.txt
          test -f web/dist/tournament/index.html
          test -f web/dist/tournament/site/events/index.html
