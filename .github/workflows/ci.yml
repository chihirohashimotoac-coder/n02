name: CI

on:
  push:
    branches: ['**']
  pull_request:

# One run per branch/PR: a new push cancels the previous, still-running one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / test / build / e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # The preview host builds with this script. It must compile, and - unlike `npm run build` -
      # it must never touch the tracked root artifacts GitHub Pages publishes, so a preview
      # deployment can never leak into production.
      #
      # Compared against the tree as it stands AFTER `npm run build`, not against a clean tree: the
      # production build is expected to write those artifacts, and this step is about proving the
      # preview build does not.
      - name: Preview build leaves production artifacts untouched
        run: |
          git status --porcelain > /tmp/tree-before-preview.txt
          npm run build:preview
          git status --porcelain > /tmp/tree-after-preview.txt
          diff /tmp/tree-before-preview.txt /tmp/tree-after-preview.txt

      # Chromium covers the desktop and Android viewports; WebKit is what backs the iPhone
      # projects in playwright.config.ts, which are skipped when it isn't installed.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # WebKit leans on shared memory heavily; the runner's default /dev/shm is small enough that a
      # long run exhausts it and takes the browser process down with it.
      - name: Enlarge /dev/shm for WebKit
        run: sudo mount -o remount,size=2G /dev/shm

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          # WebKit's accelerated compositing is a known source of browser-process crashes on
          # headless Linux CI. Disabling it changes only how WebKit paints on this runner, not what
          # the tests exercise.
          WEBKIT_DISABLE_COMPOSITING_MODE: 1

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
