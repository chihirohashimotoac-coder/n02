name: CI

on:
  push:
    branches: ['**']
  pull_request:

# One run per branch/PR: a new push cancels the previous, still-running one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / test / build / e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # Chromium covers the desktop and Android viewports; WebKit is what backs the iPhone
      # projects in playwright.config.ts, which are skipped when it isn't installed.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          # WebKit's accelerated compositing crashes the browser process on headless Linux CI during
          # long runs (many taps on one page). Disabling it is the standard Playwright workaround and
          # affects only how WebKit paints on this runner, not what the tests exercise.
          WEBKIT_DISABLE_COMPOSITING_MODE: 1

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
