<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'" />
    <meta name="referrer" content="no-referrer" />
    <title>n02 Tournament</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <p class="brand">n02 Tournament</p>
        <h1 id="event-title" class="event-title">読み込み中…</h1>
        <p class="event-meta">
          <span id="event-date"></span>
          <span id="event-status" class="event-status"></span>
          <span id="rule-badge" class="rule-badge" hidden></span>
        </p>
      </div>
    </header>

    <div class="statusbar" role="region" aria-label="更新状況">
      <dl class="statusbar__times">
        <div><dt>データ更新</dt><dd id="updated-at">—</dd></div>
        <div><dt>取得</dt><dd id="fetched-at">—</dd></div>
        <div><dt>次回自動更新</dt><dd id="next-refresh">—</dd></div>
      </dl>
      <div class="statusbar__actions">
        <button id="qr-button" class="refresh refresh--ghost" type="button" hidden>QR コード</button>
        <button id="refresh-button" class="refresh" type="button">今すぐ更新</button>
      </div>
    </div>

    <div id="banner" class="banner" role="status" aria-live="polite" hidden></div>

    <main class="content">
      <nav id="group-filter" class="filter" aria-label="グループの絞り込み" hidden></nav>
      <p id="message" class="message" role="status" hidden></p>
      <div id="groups" class="stages"></div>
      <p class="footnote">
        勝-敗・セット/Leg 得-失・順位は「確定済み」の試合だけで数えています。順位の決め方は各ステージの下に表示しています。
      </p>
    </main>

    <aside id="qr-panel" class="qr-panel" aria-label="スマートフォンで見る" hidden>
      <div id="qr-code" class="qr-panel__code"></div>
      <p class="qr-panel__title">スマホで見る</p>
      <p class="qr-panel__hint">カメラで読み取ると、この大会の速報が開きます</p>
    </aside>

    <div id="qr-overlay" class="qr-overlay" role="dialog" aria-modal="true" aria-label="この大会の QR コード" hidden>
      <div class="qr-overlay__box">
        <div id="qr-overlay-code" class="qr-overlay__code"></div>
        <p class="qr-overlay__hint">カメラで読み取ると、この大会の速報が開きます</p>
        <p id="qr-overlay-url" class="qr-overlay__url"></p>
        <button id="qr-close" class="refresh" type="button">閉じる</button>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="qrcode.js"></script>
    <script src="viewer.js"></script>
  </body>
</html>
