<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style; font-src 'self'; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; base-uri 'none'; form-action 'none'" />
    <meta name="referrer" content="strict-origin" />
    <title>トーナメント・リーグ | n02</title>
    <meta name="theme-color" content="#1a1f22" />
    <link rel="stylesheet" href="portal.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">本文へ移動</a>
    <header class="plate">
      <div class="plate__inner">
        <a class="plate__back" id="back-to-n02" href="https://chihirohashimotoac-coder.github.io/n02/">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 4 7.4 12l8 8 1.2-1.2L9.8 12l6.8-6.8L15.4 4Z" fill="currentcolor" /></svg>
          <span>n02 に戻る</span>
        </a>
        <h1 class="plate__title">トーナメント・リーグ</h1>
        <div class="plate__actions" id="account"></div>
      </div>
    </header>

    <main id="main" class="page" tabindex="-1">
      <div id="banner" class="banner-slot"></div>

      <div class="tabs" id="tabs" role="tablist" aria-label="大会の一覧" hidden>
        <button type="button" role="tab" id="tab-public" class="tabs__tab" aria-controls="results" aria-selected="true">公開中の大会</button>
        <button type="button" role="tab" id="tab-mine" class="tabs__tab" aria-controls="results" aria-selected="false" tabindex="-1">作成した大会</button>
      </div>

      <section class="toolbar" aria-label="大会の絞り込み">
        <form class="search" id="search-form" role="search">
          <label class="search__label" for="q">大会名で検索</label>
          <div class="search__field">
            <svg class="search__icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="m21 20.5-6-6a7.4 7.4 0 0 0 1.9-5A7.4 7.4 0 0 0 9.5 2 7.5 7.5 0 1 0 14 15.5l6 6 1-1ZM3.5 9.5a6 6 0 0 1 6-6 6 6 0 0 1 6 6 6 6 0 0 1-6 6 6 6 0 0 1-6-6Z" fill="currentcolor" /></svg>
            <input id="q" class="search__input" type="search" autocomplete="off" enterkeyhint="search" maxlength="80" placeholder="例: オープン、リーグ" />
            <button type="button" class="search__clear" id="q-clear" hidden>
              <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="m6.4 18.6-1-1 5.5-5.6-5.6-5.6 1.1-1 5.6 5.5 5.6-5.6 1 1.1L13 12l5.6 5.6-1 1L12 13l-5.6 5.6Z" fill="currentcolor" /></svg>
              <span>消去</span>
            </button>
          </div>
        </form>
        <div class="filters">
          <div class="segmented" id="status-filter" role="group" aria-label="開催状態で絞り込む"></div>
          <label class="select">
            <span class="select__label">形式</span>
            <select id="format-filter"></select>
          </label>
        </div>
      </section>

      <div class="list-head">
        <p class="list-head__count" id="result-count" aria-live="polite"></p>
        <p class="list-head__sync" id="sync"></p>
      </div>
      <div id="results" class="results" role="tabpanel" aria-labelledby="tab-public"></div>
    </main>

    <footer class="foot">
      <p>大会の閲覧にログインは不要です。大会の作成・運営には Google アカウント、または主催者から伝えられた管理パスワードが必要です。</p>
    </footer>

    <dialog id="event-dialog" class="dialog" aria-labelledby="event-dialog-title"></dialog>
    <dialog id="login-dialog" class="dialog" aria-labelledby="login-dialog-title"></dialog>
    <div id="toast" class="toast-box" aria-live="polite"></div>

    <script src="https://accounts.google.com/gsi/client" async></script>
    <script src="../config.js"></script>
    <script src="../admin/config.js"></script>
    <script src="portal.js"></script>
  </body>
</html>
